# Windows installer: `npm run dist` → dist/squirrel-windows/Brightboard-Setup-<version>.exe
# One click, like Claude's or Slack's: a branded animation (build/installer.gif) plays while it installs
# for the current user (no admin, no questions), adds Desktop + Start menu shortcuts, then opens the app.
appId: app.brightboard.desktop
productName: Brightboard
electronVersion: 38.8.6
# The app speaks English and Arabic; other Chromium language packs only add size.
electronLanguages: [en-US, ar]
copyright: Copyright © 2026 Brightboard
directories:
  output: dist
  buildResources: build
# electron-vite bundles everything into out/; only nut-js (remote control) is loaded at runtime.
files:
  - out/**
  - package.json
  # Only the Windows build of the remote-control library.
  - "!**/node_modules/@nut-tree-fork/libnut-{darwin,linux}/**"
asarUnpack:
  - "**/*.node"
protocols:
  - name: Brightboard invite link
    schemes: [brightboard]
win:
  target: [{ target: squirrel, arch: [x64] }]
  icon: build/icon.ico
  artifactName: Brightboard-Setup-${version}.${ext}
squirrelWindows:
  name: Brightboard
  loadingGif: build/installer.gif
  # Shown in Windows' "Installed apps" list; Squirrel needs a web address for it.
  iconUrl: https://raw.githubusercontent.com/moweb28/brightboard/main/apps/desktop/build/icon.ico
  artifactName: Brightboard-Setup-${version}.${ext}
# The classic wizard (choose a folder): `npx electron-builder --win nsis`.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Brightboard
  deleteAppDataOnUninstall: false
publish: null
