<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD25A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- sun rising behind the board -->
  <g transform="translate(256 236)">
    <g stroke="#FFC83D" stroke-width="22" stroke-linecap="round">
      <line x1="0" y1="-150" x2="0" y2="-118"/>
      <line x1="-106" y1="-106" x2="-84" y2="-84"/>
      <line x1="106" y1="-106" x2="84" y2="-84"/>
      <line x1="-150" y1="0" x2="-118" y2="0"/>
      <line x1="150" y1="0" x2="118" y2="0"/>
    </g>
    <circle r="88" fill="url(#sun)"/>
  </g>
  <!-- the board -->
  <rect x="96" y="250" width="320" height="170" rx="32" fill="#FFFFFF"/>
  <rect x="140" y="296" width="150" height="20" rx="10" fill="#C7CAF7"/>
  <rect x="140" y="340" width="96" height="20" rx="10" fill="#C7CAF7"/>
  <circle cx="356" cy="350" r="26" fill="#6366F1"/>
</svg>
